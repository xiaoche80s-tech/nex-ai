spring:
  main:
    lazy-initialization: true # 开启懒加载，加快速度
    banner-mode: off # 单元测试，禁用 Banner

--- #################### 加解密 ####################

# EncryptTypeHandler 的 AES 密钥（16 字节；仅 H2 内存库测试用，与正式环境密钥无关）。
# 键挂在 mybatis-plus 下与正式环境一致（见 nexai-server application.yaml）。
mybatis-plus:
  lazy-initialization: true # 单元测试，设置 MyBatis Mapper 延迟加载，加速每个单元测试
  encryptor:
    password: unit-test-key-16

--- #################### 数据库相关配置 ####################

spring:
  # 数据源配置项：H2 内存库（MySQL 兼容模式）
  datasource:
    name: nexai-unit-test
    url: jdbc:h2:mem:testdb;MODE=MYSQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=value; # MODE 使用 MySQL 模式；DATABASE_TO_UPPER 配置表和字段使用小写
    driver-class-name: org.h2.Driver
    username: sa
    password:
    druid:
      async-init: true # 单元测试，异步初始化 Druid 连接池，提升启动速度
      initial-size: 1 # 单元测试，配置为 1，提升启动速度
  sql:
    init:
      schema-locations: classpath:/sql/create_tables.sql
      encoding: UTF-8

--- #################### 芋道相关配置 ####################

# 芋道配置项，设置当前项目所有自定义的配置
nexai:
  info:
    base-package: com.gkht.ai.nexai.module
